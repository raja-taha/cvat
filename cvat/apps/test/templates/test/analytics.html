<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotation counts — {{ task_name }}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: Segoe UI, system-ui, sans-serif; }
    body { margin: 0; background: #f5f5f5; color: #1f1f1f; }
    header { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 16px 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .meta { color: #666; font-size: 13px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .panel { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 24px; min-height: 280px; }
    .state { padding: 48px 16px; text-align: center; color: #555; }
    .state.error { color: #a8071a; }
    canvas { max-height: 420px; }
  </style>
</head>
<body>
  <header>
    <h1>Annotations by class</h1>
    <div class="meta">Task {{ task_id }} — {{ task_name }}</div>
  </header>
  <main>
    <div class="panel">
      <div id="empty" class="state" hidden>No annotations on this task yet.</div>
      <div id="error" class="state error" hidden></div>
      <canvas id="chart" hidden></canvas>
    </div>
  </main>
  <script>
    const taskId = {{ task_id }};
    const emptyEl = document.getElementById("empty");
    const errorEl = document.getElementById("error");
    const canvas = document.getElementById("chart");

    function showError(message) {
      emptyEl.hidden = true;
      canvas.hidden = true;
      errorEl.hidden = false;
      errorEl.textContent = message;
    }

    async function loadCounts() {
      try {
        const response = await fetch(
          `/api/test/tasks/${taskId}/annotation-counts`,
          {
            credentials: "same-origin",
            headers: { Accept: "application/vnd.cvat+json; version=2.0" },
          }
        );
        if (!response.ok) {
          showError(`Could not load counts (${response.status}).`);
          return;
        }
        const data = await response.json();
        const classes = data.classes || [];
        if (!classes.length || classes.every((row) => row.count === 0)) {
          errorEl.hidden = true;
          canvas.hidden = true;
          emptyEl.hidden = false;
          return;
        }
        emptyEl.hidden = true;
        errorEl.hidden = true;
        canvas.hidden = false;
        const labels = classes.map((row) => row.name);
        const values = classes.map((row) => row.count);
        const colors = classes.map((row) => row.color || "#1677ff");
        new Chart(canvas, {
          type: "bar",
          data: {
            labels,
            datasets: [{ label: "Annotations", data: values, backgroundColor: colors }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      } catch (err) {
        showError("Could not reach the server. Check the connection and try again.");
      }
    }

    loadCounts();
  </script>
</body>
</html>
