<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Annotation analytics</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #fff;
      --text: #262626;
      --muted: #8c8c8c;
      --border: #f0f0f0;
      --primary: #1890ff;
      --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 6px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .top {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 12px 28px;
    }
    .top h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 13px; }
    main { max-width: 640px; margin: 48px auto; padding: 0 20px; }
    .panel {
      background: var(--card); border-radius: 8px; box-shadow: var(--shadow);
      padding: 32px 28px; text-align: center;
    }
    .code {
      display: inline-block; font-size: 13px; font-weight: 650; letter-spacing: .04em;
      color: #cf1322; background: #fff2f0; border: 1px solid #ffccc7;
      border-radius: 99px; padding: 4px 12px; margin-bottom: 12px;
    }
    h2 { margin: 0 0 8px; font-size: 22px; }
    p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; font: inherit; border-radius: 6px; padding: 8px 14px;
      border: 1px solid #d9d9d9; background: #fff; color: var(--text);
    }
    .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="top">
    <h1>Annotation analytics</h1>
    <div class="meta">{% if task_id %}Task {{ task_id }}{% else %}Unknown task{% endif %}</div>
  </div>
  <main>
    <div class="panel">
      <div class="code">{{ status_code }}</div>
      <h2>{{ title }}</h2>
      <p>{{ message }}</p>
      <div class="actions">
        {% if status_code == 401 %}
          <a class="btn primary" href="/auth/login?next={{ request.get_full_path|urlencode }}">Sign in</a>
        {% endif %}
        <a class="btn" href="/tasks">Back to tasks</a>
        <a class="btn" href="/">Home</a>
      </div>
    </div>
  </main>
</body>
</html>
